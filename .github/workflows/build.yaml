name: build

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build.yaml
      - Dockerfile
      - .dockerignore
      - deno.json
      - deno.lock
      - app/**
      - assets/**
      - public/**
      - docs/**
      - tools/healthcheck.ts
      - simpesys.metadata.json
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          load: true
          tags: healthcheck:latest
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Check health
        run: |
          docker run -d --name healthcheck \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --cpus 2 --memory 2g --memory-swap 2g --pids-limit 128 \
            healthcheck:latest

          for ((attempt = 0; attempt < 60; attempt++)); do
            status=$(docker inspect --format '{{.State.Health.Status}}' healthcheck)
            running=$(docker inspect --format '{{.State.Running}}' healthcheck)

            if [ "$status" = healthy ]; then
              exit 0
            fi

            if [ "$status" = unhealthy ] || [ "$running" != true ]; then
              break
            fi

            sleep 3
          done

          docker logs healthcheck
          docker inspect --format '{{json .State}}' healthcheck
          exit 1

      - name: Remove container
        if: always()
        run: docker rm -f healthcheck || true

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=arm64
